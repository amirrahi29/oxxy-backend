apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxxy-backend.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "oxxy-backend.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "oxxy-backend.fullname" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
          livenessProbe:
            tcpSocket:
              port: 8081
          resources:
            {{ toJson .Values.resources | nindent 12 }}