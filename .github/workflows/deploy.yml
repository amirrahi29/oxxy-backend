name: Build and Push to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::033193124350:role/github-actions-ecr-push
          aws-region: ap-south-1

      - uses: aws-actions/amazon-ecr-login@v2

      - run: docker build -t oxxy-backend:latest -t oxxy-backend:${{ github.sha }} .

      - run: |
          docker tag oxxy-backend:latest 033193124350.dkr.ecr.ap-south-1.amazonaws.com/oxxy-backend:latest
          docker tag oxxy-backend:${{ github.sha }} 033193124350.dkr.ecr.ap-south-1.amazonaws.com/oxxy-backend:${{ github.sha }}

      - run: |
          docker push 033193124350.dkr.ecr.ap-south-1.amazonaws.com/oxxy-backend:latest
          docker push 033193124350.dkr.ecr.ap-south-1.amazonaws.com/oxxy-backend:${{ github.sha }}

      - uses: azure/setup-kubectl@v4

      - run: aws eks update-kubeconfig --name oxxy --region ap-south-1

      - run: |
          kubectl rollout restart deployment/oxxy-backend -n default
          kubectl rollout status deployment/oxxy-backend -n default